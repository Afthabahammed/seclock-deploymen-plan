apiVersion: apps/v1
kind: Deployment
metadata:
  name: seclock-deployment
  namespace: seclock
spec:
  replicas: 2

  selector:
    matchLabels:
      app: seclock

  template:
    metadata:
      labels:
        app: seclock

    spec:
      containers:
        - name: seclock
          image: 268666184272.dkr.ecr.ap-south-1.amazonaws.com/seclock:3

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          imagePullPolicy: Always
